# File: application-dev.yml
# Purpose: Development profile with hot reload enabled
# All Rights Reserved. Arodi Emmanuel

spring:
  jpa:
    show-sql: true

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true

  # Log level for development
  logging:
    level:
      com.poetry: DEBUG
      org.springframework.security: TRACE

  # Multipart upload limits for carousel images and videos
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# Disable caching for dev
server:
  error:
    include-stacktrace: always

# Enable OpenAPI documentation
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.poetry.poetry_backend.interfaces
  show-actuator: false

# Dev-only: seed sample data on startup
admin:
  bootstrap:
    injectSampleUsers: true
    sampleCount: 50
membership:
  bootstrap:
    enabled: true
zone:
  bootstrap:
    count: 1
