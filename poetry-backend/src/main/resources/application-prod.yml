# File: application-prod.yml
# Purpose: Production profile with persistent database
# All Rights Reserved. Arodi Emmanuel

spring:
  # Disable dev tools in production
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  # Production logging
  logging:
    level:
      com.poetry: INFO

# Production server settings
server:
  error:
    include-stacktrace: never

# Disable OpenAPI documentation in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Carousel media upload directory (prod: persistent path)
carousel:
  upload-dir: ./uploads/carousel

# Multipart upload limits
spring.servlet.multipart:
  max-file-size: 200MB
  max-request-size: 200MB
